title: "THE ROYAL FAMILY"
description: "Kansas City Royals & KC Current coverage, analysis, and opinion."
image: /assets/images/TRFP-Logo.png
url: "https://theroyalfamilykc.com"
baseurl: ""
kramdown:
  typographic_symbols:
    ndash: '--'
    mdash: '---'
permalink: /:categories/:year/:month/:day/:slug/
future: true
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
category_colors:
  royals: "#004687"
  current: "#62cbc9"
  podcast: "#7AB2DD"
  opinion: "#C09C5B"
  chiefs: "#E31837"
  updates: "#C50F74"
  local: "#130551"
  sporting: "#002F65"
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: staff

  - scope:
      path: ""
      type: pages
    values:
      image: /assets/images/TRFP-Logo.png
      
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor/
  - .bundle/
